<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Snapzo Pro Admin</title>
    <style>
        /* CSS for Modern Admin UI */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .page-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #F9FAFB;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background-color: #FFFFFF;
        }

        select.form-control {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            background-color: #F9FAFB;
            transition: all 0.3s ease;
        }

        .file-upload-box:hover {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.02);
        }

        .file-upload-box input[type="file"] {
            display: none;
        }

        .image-preview {
            max-width: 100%;
            max-height: 250px;
            margin-top: 1rem;
            border-radius: 8px;
            display: none;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="page-header">
            <h2>✍️ Create New Post</h2>
            <span style="color: var(--text-muted); font-size: 0.9rem;">Snapzo Pro</span>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="postTitle">Post Title (Clickbait & Attractive)</label>
                <input type="text" id="postTitle" class="form-control" placeholder="Enter a catchy title here..." required>
            </div>

            <div class="form-group">
                <label for="postCategory">Category</label>
                <select id="postCategory" class="form-control" required>
                    <option value="" disabled selected>-- Select a Category --</option>
                    <option value="breaking">📰 Breaking News</option>
                    <option value="politics">🏛️ Politics (राजनीति)</option>
                    <option value="india">🌍 India / National</option>
                    <option value="world">🌎 World</option>
                    <option value="business">💼 Business & Economy</option>
                    <option value="technology">📱 Technology</option>
                    <option value="sports">⚽ Sports</option>
                    <option value="entertainment">🎬 Entertainment</option>
                    <option value="jobs">💼 Jobs & Education (Govt Jobs, Results, Exams)</option>
                    <option value="crime">🚔 Crime & Local News</option>
                </select>
            </div>

            <div class="form-group">
                <label for="seoTags">SEO Tags (Comma separated)</label>
                <input type="text" id="seoTags" class="form-control" placeholder="e.g. latest news, snapzo pro, viral news hindi">
                <p class="hint-text">Add up to 10 tags to rank on Google Search.</p>
            </div>

            <div class="form-group">
                <label>Upload Thumbnail Image</label>
                <div class="file-upload-box" id="drop-zone" onclick="document.getElementById('thumbnailInput').click()">
                    <span style="font-size: 2rem;">📸</span>
                    <p style="margin-top: 0.5rem; color: var(--text-muted);">Click or drag image here to upload</p>
                    <input type="file" id="thumbnailInput" accept="image/*" onchange="previewImage(event)">
                </div>
                <img id="imagePreview" class="image-preview" alt="Thumbnail Preview">
            </div>

            <div class="form-group">
                <label for="postContent">Full News Content</label>
                <textarea id="postContent" class="form-control" rows="12" placeholder="Paste your generated article here..."></textarea>
                <p class="hint-text">Note: You can easily integrate CKEditor 4 or 5 with this textarea using its ID.</p>
            </div>

            <button type="submit" class="btn-submit">🚀 Publish Post</button>

        </form>
    </div>

    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            const dropZone = document.getElementById('drop-zone');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    dropZone.style.borderStyle = 'solid';
                    dropZone.style.padding = '1rem';
                }
                
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
