{% extends "base.html" %}

{% block content %}
<style>
    body { background-color: #f0f2f5; }
    .payment-container { max-width: 800px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .page-title { font-size: 20px; font-weight: bold; margin-bottom: 25px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    
    .payment-option { border: 1px solid #d4d5d9; border-radius: 6px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.3s; }
    .payment-option:hover { border-color: #2874f0; background: #f9fbff; }
    .payment-option input { width: 18px; height: 18px; cursor: pointer; }
    .pay-details h4 { margin: 0 0 5px 0; font-size: 16px; color: #333; }
    .pay-details p { margin: 0; font-size: 13px; color: #666; }
    
    .disabled-option { opacity: 0.6; cursor: not-allowed; }
    .disabled-option:hover { border-color: #d4d5d9; background: #fff; }
    
    .btn-pay { width: 100%; background: #fb641b; color: #fff; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
    .btn-pay:hover { background: #df5817; }
</style>

<div class="payment-container">
    <div class="page-title"><i class="fas fa-wallet" style="color: #2874f0;"></i> Select Payment Method</div>
    
    <form action="/place_order" method="POST">
        
        <label class="payment-option">
            <input type="radio" name="payment_method" value="Cash on Delivery (COD)" checked>
            <div class="pay-details">
                <h4>Cash on Delivery (COD)</h4>
                <p>Pay at your doorstep when receiving the order.</p>
            </div>
            <i class="fas fa-money-bill-wave" style="margin-left: auto; font-size: 24px; color: #388e3c;"></i>
        </label>
        
        <label class="payment-option disabled-option">
            <input type="radio" name="payment_method" value="Online" disabled>
            <div class="pay-details">
                <h4>UPI / Credit Card / Debit Card</h4>
                <p style="color: #e74c3c;">Currently unavailable. Coming soon!</p>
            </div>
            <div style="margin-left: auto; display: flex; gap: 10px; font-size: 20px; color: #555;">
                <i class="fab fa-google-pay"></i>
                <i class="fab fa-cc-visa"></i>
            </div>
        </label>

        <button type="submit" class="btn-pay">CONFIRM ORDER</button>
    </form>
</div>
{% endblock %}
