<!DOCTYPE html>
<html lang="en">
<head>
    <title>Verify OTP | VISTAN</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f1f3f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .form-input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; outline: none; text-align: center; font-size: 20px; letter-spacing: 5px; }
        .btn { background: #2ecc71; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Verify OTP</h2>
        <p style="color: #666; font-size: 14px;">We have sent a 6-digit OTP to<br><strong>{{ email }}</strong></p>
        
        <form method="POST">
            <input type="text" name="otp" class="form-input" placeholder="000000" maxlength="6" required>
            <button type="submit" class="btn">Verify & Login</button>
        </form>
        <a href="/login" style="display: block; margin-top: 20px; font-size: 13px; color: #2874f0; text-decoration: none;">Change Email</a>
    </div>
</body>
</html>
