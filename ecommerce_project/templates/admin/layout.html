<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISTAN Admin Pro | Control Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --primary-blue: #2874f0;
            --dark-bg: #1a222f;
            --light-bg: #f4f7fa;
            --text-dark: #333;
            --text-light: #b8c1cc;
            --transition: all 0.3s ease;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-bg);
            display: flex;
        }

        /* ================= SIDEBAR DESIGN ================= */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--dark-bg);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            color: white;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #2d3a4f;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .nav-menu {
            flex-grow: 1;
            padding: 20px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 25px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }

        .nav-item i {
            margin-right: 15px;
            width: 20px;
            font-size: 18px;
            text-align: center;
        }

        .nav-item:hover {
            background-color: rgba(255,255,255,0.05);
            color: #fff;
        }

        /* Active state for current page */
        .nav-item.active {
            background-color: rgba(40, 116, 240, 0.15);
            color: #fff;
            border-left-color: var(--primary-blue);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid #2d3a4f;
        }

        .exit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: var(--transition);
        }

        .exit-btn:hover {
            background: #c0392b;
            transform: scale(1.02);
        }

        /* ================= MAIN CONTENT AREA ================= */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
        }

        .top-navbar {
            height: 70px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .page-info h3 {
            margin: 0;
            color: var(--text-dark);
            font-size: 18px;
        }

        .user-profile-top {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .view-site-btn {
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: 600;
            font-size: 14px;
            border: 1px solid var(--primary-blue);
            padding: 6px 15px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .view-site-btn:hover {
            background: var(--primary-blue);
            color: #fff;
        }

        .content-body {
            padding: 30px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #999; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-bolt" style="color: #ffd700;"></i> VISTAN PRO</h2>
        </div>

        <nav class="nav-menu">
            <a href="/admin" class="nav-item">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="/admin/products" class="nav-item">
                <i class="fas fa-box-open"></i> Products & Stock
            </a>
            <a href="/admin/orders" class="nav-item">
                <i class="fas fa-truck-loading"></i> Orders & Payments
            </a>
            <a href="/admin/users" class="nav-item">
                <i class="fas fa-user-shield"></i> User Management
            </a>
            <a href="/admin/settings" class="nav-item">
                <i class="fas fa-cogs"></i> Website Settings
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/" class="exit-btn">
                <i class="fas fa-sign-out-alt"></i> Exit to Store
            </a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="top-navbar">
            <div class="page-info">
                <h3>Admin Control Panel <small style="color: #999; font-weight: normal; margin-left: 10px;">Varanasi, UP</small></h3>
            </div>
            <div class="user-profile-top">
                <a href="/" target="_blank" class="view-site-btn"><i class="fas fa-external-link-alt"></i> View Live Site</a>
                <div style="width: 35px; height: 35px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #666; border: 2px solid #ddd;">A</div>
            </div>
        </header>

        <main class="content-body">
            {% block content %}
            {% endblock %}
        </main>
        
        <footer style="text-align: center; padding: 20px; color: #aaa; font-size: 13px;">
            VISTAN PREMIUM &copy; 2026 | Developed by Vishal Yadav
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname;
            const menuItems = document.querySelectorAll('.nav-item');
            
            menuItems.forEach(item => {
                if (item.getAttribute('href') === currentPath) {
                    item.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
