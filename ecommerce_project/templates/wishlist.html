{% extends 'base.html' %}

{% block content %}
<div style="max-width: 1200px; margin: 40px auto; padding: 20px;">
    <h2>❤️ My Wishlist</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
        {% for product in products %}
        <div style="background: white; border: 1px solid #ddd; padding: 15px; text-align: center; border-radius: 8px;">
            <img src="{{ product.image_url }}" style="width: 100px; height: 100px; object-fit: contain;">
            <h4 style="margin: 10px 0;">{{ product.name }}</h4>
            <p style="font-weight: bold; color: #2874f0;">₹{{ product.selling_price }}</p>
            <form action="/wishlist/toggle/{{ product.id }}" method="POST">
                <button type="submit" style="background:#ff4757; color:white; border:none; padding:8px 15px; border-radius:3px; cursor:pointer; width: 100%;">Remove</button>
            </form>
        </div>
        {% else %}
        <div style="text-align: center; width: 100%; grid-column: 1 / -1; padding: 50px;">
            <h3 style="color: #888;">Your wishlist is empty!</h3>
            <a href="/" style="display: inline-block; margin-top: 10px; background: #2874f0; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">Explore Products</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
