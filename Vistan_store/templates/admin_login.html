<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Vistan Store</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #282c3f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 350px; text-align: center; }
        .login-box img { height: 60px; margin-bottom: 20px; }
        .login-box h2 { margin-bottom: 20px; color: #282c3f; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #ff3f6c; }
        button { width: 100%; padding: 14px; background: #ff3f6c; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e0355d; }
        .error { color: red; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="/static/81160.png" alt="Vistan Admin">
        <h2>Admin Portal</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login as Admin</button>
        </form>
        <p style="font-size: 12px; color: #888; margin-top: 20px;">Secured by Vistan Systems</p>
    </div>
</body>
</html>
